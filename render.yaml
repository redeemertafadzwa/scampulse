services:
  - type: web
    name: scampulse
    runtime: python
    plan: starter            # paid tier: avoids idle-sleep during judging
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_feed"
    startCommand: "gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.6"
